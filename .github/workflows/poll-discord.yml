name: Poll Discord Channel

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: List files (debug)
        run: |
          echo "Current directory:"
          pwd
          echo "Files here:"
          ls -la

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Poll Discord and forward new images to Google Sheet
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: node poll.mjs
