name: Poll Discord Channel

on:
  schedule:
    - cron: '*/5 * * * *'  # every 15 minutes - screenshots come roughly hourly, so this is a good balance
  workflow_dispatch: {}      # lets you click "Run workflow" manually to test

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Poll Discord and forward new images to Google Sheet
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: node poll.mjs
